<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>约稿日历</title>
  <style>
    :root {
      --blue-50: #eff6ff;
      --blue-100: #dbeafe;
      --blue-200: #bfdbfe;
      --blue-400: #60a5fa;
      --blue-500: #3b82f6;
      --blue-600: #2563eb;
      --blue-700: #1d4ed8;
      --blue-900: #1e3a8a;
      --pink-50: #fdf2f8;
      --pink-100: #fce7f3;
      --pink-200: #fbcfe8;
      --pink-400: #f472b6;
      --pink-500: #ec4899;
      --pink-600: #db2777;
      --ink: #0f172a;
      --muted: #64748b;
      --surface: rgba(255, 255, 255, 0.9);
      --shadow: 0 4px 28px rgba(37, 99, 235, 0.1);
      --radius: 14px;
      --font: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      --cal-bar-h: 7px;
      --cal-bar-r: 3.5px;
      --cal-bar-a: 0.78;
      /* 色条区起点：首条顶缘 ≈ 数字下方（与单元格 padding-top + 字号行高对齐） */
      --cal-bars-top: 26px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: linear-gradient(135deg, var(--blue-100) 0%, var(--pink-50) 45%, #e0f2fe 100%);
      color: var(--ink);
      padding: 1.25rem 1rem 2rem;
      touch-action: pan-y;
      overflow-x: hidden;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
      background: linear-gradient(120deg, var(--blue-600), var(--pink-500), var(--blue-500));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.8125rem;
      color: var(--muted);
    }

    .card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(59, 130, 246, 0.12);
      padding: 1rem 1rem 1.1rem;
      animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      padding: 0 0.15rem;
    }

    .cal-nav h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--blue-900);
    }

    .cal-nav-btns {
      display: flex;
      gap: 0.35rem;
    }

    .cal-nav button {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: rgba(59, 130, 246, 0.12);
      color: var(--blue-700);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
    }

    .cal-nav button:hover {
      background: rgba(236, 72, 153, 0.12);
      color: var(--pink-600);
    }

    .cal-nav button:active {
      transform: scale(0.94);
    }

    .cal-surface {
      background: #fff;
      border-radius: 10px;
      overflow: visible;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0;
      row-gap: 0;
      column-gap: 0;
      margin: 0;
      padding: 0.5rem 0 1rem;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--blue-500);
      text-align: center;
      letter-spacing: 0.02em;
      justify-items: stretch;
    }

    .weekdays > span {
      display: block;
      text-align: center;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0;
      row-gap: 0;
      column-gap: 0;
      margin: 0;
      padding: 0;
      overflow: visible;
      background: #fff;
      width: 100%;
    }

    .day-cell {
      position: relative;
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      min-height: 0;
      justify-self: stretch;
      align-self: stretch;
      aspect-ratio: 1;
      border: none;
      border-radius: 0;
      cursor: pointer;
      background: transparent;
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      transition: background 0.18s ease, box-shadow 0.2s;
      padding: 5px 5px 25px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      overflow: visible;
      margin: 0;
      box-shadow: none;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .day-cell:focus-visible {
      z-index: 1;
      box-shadow: inset 0 0 0 2px rgba(59, 130, 246, 0.45);
    }

    .day-cell:hover:not(.selected) {
      background: rgba(0, 0, 0, 0.02);
    }

    .day-cell:active:not(.selected) {
      background: rgba(0, 0, 0, 0.035);
    }

    .day-cell.other {
      color: #94a3b8;
      background: transparent;
    }

    .day-cell.today:not(.selected) {
      background: rgba(59, 130, 246, 0.08);
      box-shadow: none;
    }

    .day-cell.today:not(.selected):hover {
      background: rgba(59, 130, 246, 0.12);
    }

    .day-cell.selected {
      background: linear-gradient(145deg, var(--blue-500), var(--pink-500));
      color: #fff;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
    }

    .day-cell.selected.other {
      color: #fff;
      opacity: 0.92;
    }

    .day-cell.selected:hover {
      filter: brightness(0.98);
    }

    .day-num {
      display: block;
      line-height: 1.2;
      position: relative;
      z-index: 2;
      flex: 0 0 auto;
      align-self: center;
      text-align: center;
      width: 100%;
    }

    .range-bars {
      position: absolute;
      left: 0;
      right: 0;
      width: 100%;
      top: var(--cal-bars-top);
      bottom: auto;
      min-height: var(--cal-bar-h);
      margin: 0;
      pointer-events: none;
      z-index: 0;
      overflow: visible;
    }

    .range-bar {
      position: absolute;
      height: var(--cal-bar-h);
      left: 0;
      right: 0;
      width: 100%;
      max-width: none;
      margin: 0;
      border-radius: var(--cal-bar-r);
      box-sizing: border-box;
      box-shadow: none;
      transform: translateZ(0);
      -webkit-font-smoothing: antialiased;
    }

    .range-bar.seg-mid,
    .range-bar.seg-mid-rend,
    .range-bar.seg-mid-rstart,
    .range-bar.seg-start,
    .range-bar.seg-end {
      border-radius: 0;
      box-shadow: none;
    }

    /* 蜜语浅绯：半透明果冻感 */
    .range-bar.shade-0 {
      background: rgba(240, 168, 182, var(--cal-bar-a));
    }
    .range-bar.shade-1 {
      background: rgba(246, 198, 208, var(--cal-bar-a));
    }
    .range-bar.shade-2 {
      background: rgba(243, 222, 222, var(--cal-bar-a));
    }
    .range-bar.shade-3 {
      background: rgba(248, 233, 231, var(--cal-bar-a));
    }
    .range-bar.shade-4 {
      background: rgba(251, 245, 239, var(--cal-bar-a));
    }

    .range-bar.is-done {
      opacity: 0.55;
    }

    .range-bar.seg-single {
      left: 0;
      right: 0;
      width: 100%;
    }

    .range-bar.seg-start {
      left: 50%;
      right: -1px;
      width: auto;
      border-radius: var(--cal-bar-r) 0 0 var(--cal-bar-r);
    }

    .range-bar.seg-start-brk {
      left: 50%;
      right: 0;
      width: auto;
      border-radius: var(--cal-bar-r);
    }

    .range-bar.seg-end {
      left: -1px;
      right: 50%;
      width: auto;
      border-radius: 0 var(--cal-bar-r) var(--cal-bar-r) 0;
    }

    .range-bar.seg-end-brk {
      left: 0;
      right: 50%;
      width: auto;
      border-radius: var(--cal-bar-r);
    }

    .range-bar.seg-mid {
      left: -1px;
      right: -1px;
      width: auto;
      border-radius: 0;
    }

    .range-bar.seg-mid-rend {
      left: -1px;
      right: 0;
      width: auto;
      border-radius: 0;
    }

    .range-bar.seg-mid-rstart {
      left: 0;
      right: -1px;
      width: auto;
      border-radius: 0;
    }

    .range-bar.seg-mid-isle {
      left: 0;
      right: 0;
      width: 100%;
      border-radius: var(--cal-bar-r);
    }

    .day-cell.selected .range-bar {
      filter: brightness(1.08);
    }

    .day-cell.selected .range-bar.is-done {
      opacity: 0.5;
      filter: brightness(1.05);
    }

    .hint {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.85rem;
      line-height: 1.55;
    }

    .hint .hint-emoji {
      display: inline-block;
      margin-left: 0.35em;
      letter-spacing: 0.15em;
      opacity: 0.9;
    }

    .cal-hover-tip {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 530;
      min-width: 140px;
      max-width: 280px;
      padding: 10px 12px;
      background: #fff;
      color: #0f172a;
      border-radius: 12px;
      box-shadow:
        0 10px 40px rgba(15, 23, 42, 0.14),
        0 2px 8px rgba(15, 23, 42, 0.06);
      font-family: var(--font-cal);
      font-size: 0.78rem;
      line-height: 1.45;
      pointer-events: none;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.12s ease, visibility 0.12s ease;
      text-align: left;
    }

    .cal-hover-tip.is-visible {
      visibility: visible;
      opacity: 1;
    }

    .cal-hover-tip-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .cal-hover-tip-row + .cal-hover-tip-row {
      margin-top: 6px;
    }

    .cal-hover-tip-dot {
      flex-shrink: 0;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-top: 0.32em;
    }

    .cal-hover-tip-dot.shade-0 {
      background: rgba(240, 168, 182, var(--cal-bar-a));
    }
    .cal-hover-tip-dot.shade-1 {
      background: rgba(246, 198, 208, var(--cal-bar-a));
    }
    .cal-hover-tip-dot.shade-2 {
      background: rgba(243, 222, 222, var(--cal-bar-a));
    }
    .cal-hover-tip-dot.shade-3 {
      background: rgba(248, 233, 231, var(--cal-bar-a));
    }
    .cal-hover-tip-dot.shade-4 {
      background: rgba(251, 245, 239, var(--cal-bar-a));
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 510;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      position: fixed;
      top: 50%;
      left: 50%;
      right: auto;
      bottom: auto;
      width: min(440px, calc(100vw - 1.5rem));
      max-width: calc(100vw - 1.5rem);
      max-height: calc(100vh - 2rem);
      max-height: min(85dvh, calc(100vh - 2rem));
      margin: 0;
      background: linear-gradient(180deg, #fff 0%, var(--pink-50) 55%, var(--blue-50) 100%);
      border-radius: 18px;
      box-shadow:
        0 20px 60px rgba(15, 23, 42, 0.18),
        0 8px 24px rgba(37, 99, 235, 0.12);
      z-index: 520;
      transform: translate(-50%, -50%) scale(0.96);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 0.22s ease,
        transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 0.28s;
      display: flex;
      flex-direction: column;
      padding: 0;
      border: 1px solid var(--pink-200);
      overflow: hidden;
    }

    .sheet.open {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition:
        opacity 0.22s ease,
        transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s;
    }

    .sheet-modal-header {
      flex-shrink: 0;
      padding: 1rem 1.1rem 0.35rem;
    }

    .sheet-body-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 1.1rem 1rem;
      padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    }

    .sheet-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.45rem;
    }

    .sheet-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--blue-900);
      line-height: 1.35;
    }

    .sheet-close {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: rgba(59, 130, 246, 0.1);
      color: var(--blue-700);
      transition: background 0.2s, transform 0.15s;
    }

    .sheet-close:hover {
      background: rgba(236, 72, 153, 0.12);
      color: var(--pink-600);
    }

    .sheet-close:active {
      transform: scale(0.94);
    }

    .stats {
      font-size: 0.8125rem;
      color: var(--muted);
      margin: 0 0 0.55rem;
    }

    .stats strong {
      font-weight: 700;
      color: var(--blue-600);
    }

    .commission-form {
      margin-bottom: 0.65rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
    }

    .field {
      margin-bottom: 0.55rem;
    }

    .field label,
    .field .field-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--blue-700);
      margin-bottom: 0.25rem;
      letter-spacing: 0.02em;
    }

    .field input[type="text"],
    .field input[type="date"],
    .field textarea {
      width: 100%;
      padding: 0.55rem 0.7rem;
      border: 2px solid var(--blue-200);
      border-radius: 9px;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fff;
    }

    .field textarea {
      min-height: 4.5rem;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--pink-400);
      box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.18);
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #94a3b8;
    }

    /* iOS Safari：字号小于 16px 的焦点输入会触发整页缩放 */
    @media screen and (max-width: 768px) {
      .field input[type="text"],
      .field input[type="date"],
      .field textarea {
        font-size: 16px;
      }
    }

    .date-range-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .date-range-row input[type="date"] {
      flex: 1 1 0;
      min-width: 0;
      width: auto;
    }

    .range-sep {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      flex-shrink: 0;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .form-actions--edit {
      justify-content: space-between;
    }

    button.cancel-edit {
      padding: 0.5rem 0.85rem;
      border-radius: 10px;
      border: 2px solid var(--blue-200);
      background: #fff;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    button.cancel-edit:hover {
      border-color: var(--pink-300);
      color: var(--pink-600);
    }

    button.add {
      padding: 0.55rem 1.15rem;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      background: linear-gradient(135deg, var(--blue-600), var(--pink-500));
      color: #fff;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 2px 14px rgba(37, 99, 235, 0.28);
    }

    button.add:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 18px rgba(236, 72, 153, 0.3);
    }

    .sheet-scroll {
      margin-top: 0.35rem;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0 0 0.5rem;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      padding: 0.65rem 0.5rem;
      border-radius: 11px;
      margin-bottom: 0.45rem;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(191, 219, 254, 0.6);
      transition: background 0.2s, border-color 0.2s;
      overflow: hidden;
    }

    .task-item.entering {
      animation: taskEnter 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes taskEnter {
      from {
        opacity: 0;
        transform: translateX(-10px) scale(0.98);
        max-height: 0;
        padding-top: 0;
        padding-bottom: 0;
        margin-bottom: 0;
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
        max-height: 560px;
        padding-top: 0.65rem;
        padding-bottom: 0.65rem;
        margin-bottom: 0.45rem;
      }
    }

    .task-item.removing {
      animation: taskLeave 0.35s cubic-bezier(0.55, 0, 1, 0.45) forwards;
    }

    @keyframes taskLeave {
      to {
        opacity: 0;
        transform: translateX(14px) scale(0.96);
        max-height: 0;
        padding-top: 0;
        padding-bottom: 0;
        margin-bottom: 0;
      }
    }

    .task-item:hover {
      background: #fff;
      border-color: var(--pink-200);
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .task-item.completed .task-meta {
      opacity: 0.55;
    }

    .checkbox-wrap {
      position: relative;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      margin-top: 0.15rem;
    }

    .task-item input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      z-index: 1;
    }

    .checkbox-ui {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--blue-400);
      background: #fff;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .task-item input[type="checkbox"]:checked + .checkbox-ui {
      background: linear-gradient(135deg, var(--blue-600), var(--pink-500));
      border-color: var(--pink-500);
      transform: scale(1.05);
    }

    .checkbox-ui svg {
      width: 12px;
      height: 12px;
      stroke: #fff;
      stroke-width: 2.5;
      fill: none;
      opacity: 0;
      transform: scale(0.3);
      transition: opacity 0.2s, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .task-item input[type="checkbox"]:checked + .checkbox-ui svg {
      opacity: 1;
      transform: scale(1);
    }

    .task-body {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--blue-900);
      line-height: 1.35;
      margin-bottom: 0.35rem;
      cursor: pointer;
    }

    .task-meta {
      display: grid;
      gap: 0.2rem;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .task-meta span {
      display: block;
    }

    .task-meta b {
      color: var(--blue-700);
      font-weight: 600;
    }

    button.delete {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
      color: var(--blue-400);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }

    button.delete:hover {
      background: rgba(239, 68, 68, 0.1);
      color: #dc2626;
    }

    button.delete:active {
      transform: scale(0.92);
    }

    .task-actions {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
      align-items: center;
    }

    button.edit-item {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
      color: var(--blue-500);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }

    button.edit-item:hover {
      background: rgba(59, 130, 246, 0.1);
      color: var(--blue-700);
    }

    button.edit-item:active {
      transform: scale(0.92);
    }

    .empty {
      text-align: center;
      padding: 1.25rem 0.75rem;
      color: #94a3b8;
      font-size: 0.88rem;
    }

    .empty.hidden {
      display: none;
    }

    .grid.switching {
      animation: gridFade 0.28s ease both;
    }

    @keyframes gridFade {
      from {
        opacity: 0.35;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>约稿日历</h1>
      <p class="subtitle">合理安排档期，不要太累哦！(๑•̀ㅂ•́)و✧</p>
    </header>

    <div class="card">
      <div class="cal-nav">
        <h2 id="monthLabel"></h2>
        <div class="cal-nav-btns">
          <button type="button" id="prevMonth" aria-label="上个月">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <button type="button" id="nextMonth" aria-label="下个月">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <div class="cal-surface">
        <div class="weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="grid" id="calGrid" role="grid" aria-label="约稿日历月视图"></div>
      </div>
      <p class="hint">
        🌿 如果稿件全都做完了，那就给自己放个小假吹吹风吧～ ✨
        <span class="hint-emoji" aria-hidden="true">☁️ 🍃 💤</span>
      </p>
    </div>
  </div>

  <div
    id="calHoverTip"
    class="cal-hover-tip"
    role="tooltip"
    aria-hidden="true"
  ></div>

  <div class="overlay" id="overlay" aria-hidden="true"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
    <div class="sheet-modal-header">
      <div class="sheet-head">
        <h3 class="sheet-title" id="sheetTitle"></h3>
        <button type="button" class="sheet-close" id="sheetClose" aria-label="关闭">✕</button>
      </div>
      <p class="stats" id="stats">还剩 <strong id="count">0</strong> 条未完成</p>
    </div>
    <div class="sheet-body-scroll" id="sheetBodyScroll">
    <form class="commission-form" id="form" autocomplete="off">
      <div class="field">
        <label for="fProject">稿件项目</label>
        <input type="text" id="fProject" name="project" placeholder="例如：头像插、立绘、封面" maxlength="120" />
      </div>
      <div class="field">
        <span id="fPhaseRangeLabel" class="field-label">稿件制作工期</span>
        <div class="date-range-row" role="group" aria-labelledby="fPhaseRangeLabel">
          <input type="date" id="fPhaseStart" name="phaseStart" aria-label="工期开始日期" />
          <span class="range-sep">至</span>
          <input type="date" id="fPhaseEnd" name="phaseEnd" aria-label="工期结束日期" />
        </div>
      </div>
      <div class="field">
        <label for="fClient">稿主</label>
        <input type="text" id="fClient" name="client" placeholder="稿主昵称或称呼" maxlength="80" />
      </div>
      <div class="field">
        <label for="fStyle">风格</label>
        <input type="text" id="fStyle" name="style" placeholder="例如：日系平涂、厚涂" maxlength="80" />
      </div>
      <div class="field">
        <label for="fColors">配色</label>
        <input type="text" id="fColors" name="colors" placeholder="主色、辅助色或参考说明" maxlength="120" />
      </div>
      <div class="field">
        <label for="fCopy">文案内容</label>
        <textarea id="fCopy" name="copy" placeholder="需要写在画面里的文案、标题等" maxlength="2000"></textarea>
      </div>
      <div class="form-actions" id="formActions">
        <button type="button" class="cancel-edit" id="cancelEdit" hidden>取消编辑</button>
        <button type="submit" class="add" id="submitCommission">添加约稿</button>
      </div>
    </form>

      <div class="sheet-scroll">
        <ul id="list" aria-live="polite"></ul>
        <p class="empty" id="empty">这一天还没有约稿，填写上方表单后添加</p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_CAL = "yuegao-rili-v1";
      const STORAGE_CAL_PREVIOUS = "todo-calendar-v1";
      const STORAGE_LEGACY = "todo-app-v1";

      const monthLabel = document.getElementById("monthLabel");
      const calGrid = document.getElementById("calGrid");
      const prevBtn = document.getElementById("prevMonth");
      const nextBtn = document.getElementById("nextMonth");
      const overlay = document.getElementById("overlay");
      const sheet = document.getElementById("sheet");
      const sheetBodyScroll = document.getElementById("sheetBodyScroll");
      const sheetTitle = document.getElementById("sheetTitle");
      const sheetClose = document.getElementById("sheetClose");
      const listEl = document.getElementById("list");
      const formEl = document.getElementById("form");
      const countEl = document.getElementById("count");
      const emptyEl = document.getElementById("empty");
      const fProject = document.getElementById("fProject");
      const fPhaseStart = document.getElementById("fPhaseStart");
      const fPhaseEnd = document.getElementById("fPhaseEnd");
      const fClient = document.getElementById("fClient");
      const fStyle = document.getElementById("fStyle");
      const fColors = document.getElementById("fColors");
      const fCopy = document.getElementById("fCopy");
      const cancelEditBtn = document.getElementById("cancelEdit");
      const submitCommissionBtn = document.getElementById("submitCommission");
      const formActions = document.getElementById("formActions");

      const WEEK = ["日", "一", "二", "三", "四", "五", "六"];

      let editingId = null;

      function pad(n) {
        return String(n).padStart(2, "0");
      }

      function dateKey(y, m, d) {
        return y + "-" + pad(m + 1) + "-" + pad(d);
      }

      function keyFromDate(dt) {
        return dateKey(dt.getFullYear(), dt.getMonth(), dt.getDate());
      }

      function newId() {
        return crypto.randomUUID
          ? crypto.randomUUID()
          : String(Date.now()) + Math.random().toString(36).slice(2);
      }

      function normDateStr(s) {
        if (s == null || s === "") return "";
        const p = String(s).slice(0, 10);
        return /^\d{4}-\d{2}-\d{2}$/.test(p) ? p : "";
      }

      function spanBounds(task) {
        let a = normDateStr(task.phaseStart);
        let b = normDateStr(task.phaseEnd);
        if (!a && !b) {
          a = normDateStr(task.startDate);
          b = normDateStr(task.deadline);
        }
        if (!a && b) a = b;
        if (a && !b) b = a;
        if (!a) {
          a = keyFromDate(new Date());
          b = a;
        }
        if (b < a) {
          const t = a;
          a = b;
          b = t;
        }
        return { start: a, end: b };
      }

      function visibleOnDay(task, dayKey) {
        const { start, end } = spanBounds(task);
        return dayKey >= start && dayKey <= end;
      }

      function loadStoreRaw() {
        try {
          let raw = localStorage.getItem(STORAGE_CAL);
          if (!raw) raw = localStorage.getItem(STORAGE_CAL_PREVIOUS);
          if (raw) {
            const o = JSON.parse(raw);
            return o && typeof o === "object" ? o : {};
          }
          const leg = localStorage.getItem(STORAGE_LEGACY);
          if (leg) {
            const arr = JSON.parse(leg);
            if (Array.isArray(arr) && arr.length) {
              const k = keyFromDate(new Date());
              return { [k]: arr };
            }
          }
        } catch (_) {}
        return {};
      }

      function normalizeTask(t) {
        if (!t || typeof t !== "object") return null;
        let phaseStart = normDateStr(t.phaseStart);
        let phaseEnd = normDateStr(t.phaseEnd);
        if (!phaseStart && !phaseEnd) {
          phaseStart = normDateStr(t.startDate) || "";
          phaseEnd = normDateStr(t.deadline != null ? String(t.deadline) : "") || "";
        }
        if (!phaseStart && phaseEnd) phaseStart = phaseEnd;
        if (phaseStart && !phaseEnd) phaseEnd = phaseStart;
        if (phaseStart && phaseEnd && phaseEnd < phaseStart) {
          const x = phaseStart;
          phaseStart = phaseEnd;
          phaseEnd = x;
        }
        const base = {
          id: t.id || newId(),
          done: !!t.done,
          phaseStart: phaseStart,
          phaseEnd: phaseEnd,
          client: t.client != null ? String(t.client) : "",
          style: t.style != null ? String(t.style) : "",
          colors: t.colors != null ? String(t.colors) : "",
          copy: t.copy != null ? String(t.copy) : "",
        };
        if (t.project != null && String(t.project).trim() !== "") {
          base.project = String(t.project).trim();
          return base;
        }
        if (t.text != null && String(t.text).trim() !== "") {
          base.project = String(t.text).trim();
          return base;
        }
        base.project = "（未命名稿件）";
        return base;
      }

      function hydrateStore(raw) {
        if (!raw || typeof raw !== "object" || Array.isArray(raw)) {
          return { items: [] };
        }
        if (Array.isArray(raw.items)) {
          return { items: raw.items.map(normalizeTask).filter(Boolean) };
        }
        const items = [];
        Object.keys(raw).forEach(function (key) {
          if (key === "items" || key === "v" || key === "version") return;
          const arr = raw[key];
          if (!Array.isArray(arr)) return;
          arr.forEach(function (t) {
            const n = normalizeTask(t);
            if (!n) return;
            if (!n.phaseStart) n.phaseStart = normDateStr(key) || key;
            if (!n.phaseEnd) n.phaseEnd = n.phaseStart;
            items.push(n);
          });
        });
        return { items: items };
      }

      let store = hydrateStore(loadStoreRaw());

      function saveStore() {
        localStorage.setItem(STORAGE_CAL, JSON.stringify({ items: store.items }));
      }

      saveStore();

      let view = new Date();
      let openKey = null;

      function tasksFor(dayKey) {
        return store.items
          .filter(function (t) {
            return visibleOnDay(t, dayKey);
          })
          .sort(function (a, b) {
            const c = (a.phaseStart || "").localeCompare(b.phaseStart || "");
            if (c !== 0) return c;
            return String(a.id || "").localeCompare(String(b.id || ""));
          });
      }

      function addDaysFromKey(key, delta) {
        const p = key.split("-").map(Number);
        const d = new Date(p[0], p[1] - 1, p[2] + delta);
        return dateKey(d.getFullYear(), d.getMonth(), d.getDate());
      }

      function segmentForTaskOnDay(task, key, i, keys) {
        if (!visibleOnDay(task, key)) return null;
        const chronPrev = addDaysFromKey(key, -1);
        const chronNext = addDaysFromKey(key, 1);
        const timeP = visibleOnDay(task, chronPrev);
        const timeN = visibleOnDay(task, chronNext);
        const rowPrev = i % 7 === 0 ? null : keys[i - 1];
        const rowNext = i % 7 === 6 ? null : keys[i + 1];
        const continueLeft = timeP && rowPrev === chronPrev;
        const continueRight = timeN && rowNext === chronNext;

        if (!timeP && !timeN) return "seg-single";
        if (!timeP && timeN) return continueRight ? "seg-start" : "seg-start-brk";
        if (timeP && !timeN) return continueLeft ? "seg-end" : "seg-end-brk";
        if (continueLeft && continueRight) return "seg-mid";
        if (continueLeft && !continueRight) return "seg-mid-rend";
        if (!continueLeft && continueRight) return "seg-mid-rstart";
        return "seg-mid-isle";
      }

      function buildShadeRankMap() {
        const sorted = store.items.slice().sort(function (a, b) {
          const c = (a.phaseStart || "").localeCompare(b.phaseStart || "");
          if (c !== 0) return c;
          return String(a.id || "").localeCompare(String(b.id || ""));
        });
        const m = new Map();
        sorted.forEach(function (t, idx) {
          m.set(t.id, idx);
        });
        return m;
      }

      function buildLaneMap() {
        const sorted = store.items.slice().sort(function (a, b) {
          const c = (a.phaseStart || "").localeCompare(b.phaseStart || "");
          if (c !== 0) return c;
          return String(a.id || "").localeCompare(String(b.id || ""));
        });
        const ends = [];
        const map = new Map();
        sorted.forEach(function (task) {
          const span = spanBounds(task);
          const start = span.start;
          const end = span.end;
          let placed = -1;
          for (let L = 0; L < ends.length; L++) {
            if (ends[L] < start) {
              placed = L;
              ends[L] = end;
              break;
            }
          }
          if (placed < 0) {
            placed = ends.length;
            ends.push(end);
          }
          map.set(task.id, placed);
        });
        const maxLane = ends.length === 0 ? 0 : ends.length - 1;
        return { laneMap: map, maxLane: maxLane };
      }

      function rangeBarsHtml(key, i, keys, shadeRank, laneInfo) {
        const tasks = tasksFor(key);
        const n = tasks.length;
        if (!n) return "";
        const maxLane = laneInfo.maxLane;
        const barH = 7;
        const laneGap = 4;
        const step = barH + laneGap;
        const stackH = maxLane * step + barH;
        const sorted = tasks.slice().sort(function (a, b) {
          const la = laneInfo.laneMap.has(a.id) ? laneInfo.laneMap.get(a.id) : 0;
          const lb = laneInfo.laneMap.has(b.id) ? laneInfo.laneMap.get(b.id) : 0;
          if (la !== lb) return la - lb;
          const c = (a.phaseStart || "").localeCompare(b.phaseStart || "");
          if (c !== 0) return c;
          return String(a.id || "").localeCompare(String(b.id || ""));
        });
        let html =
          '<span class="range-bars" style="height:' + Math.max(stackH, barH) + 'px">';
        for (let ti = 0; ti < sorted.length; ti++) {
          const task = sorted[ti];
          const seg = segmentForTaskOnDay(task, key, i, keys);
          if (!seg) continue;
          const doneCls = task.done ? " is-done" : "";
          const rank = shadeRank.has(task.id) ? shadeRank.get(task.id) : 0;
          const shade = "shade-" + String(rank % 5);
          const lane = laneInfo.laneMap.has(task.id) ? laneInfo.laneMap.get(task.id) : 0;
          const bottomPx = (maxLane - lane) * step;
          html +=
            '<span class="range-bar ' +
            seg +
            " " +
            shade +
            doneCls +
            '" style="bottom:' +
            bottomPx +
            "px;z-index:" +
            (1 + lane) +
            '" aria-hidden="true"></span>';
        }
        html += "</span>";
        return html;
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      let calTipEl = null;
      let calTipShowT = null;
      let calTipHideT = null;
      let calTipPendingKey = null;
      let calTipActiveKey = null;
      let calTipCursorX = 0;
      let calTipCursorY = 0;
      let calTipPosRaf = null;

      function hideCalHoverTip() {
        clearTimeout(calTipShowT);
        calTipShowT = null;
        clearTimeout(calTipHideT);
        calTipHideT = null;
        if (calTipPosRaf) {
          cancelAnimationFrame(calTipPosRaf);
          calTipPosRaf = null;
        }
        calTipPendingKey = null;
        calTipActiveKey = null;
        if (!calTipEl) return;
        calTipEl.classList.remove("is-visible");
        calTipEl.innerHTML = "";
        calTipEl.style.left = "";
        calTipEl.style.top = "";
        calTipEl.style.visibility = "";
        calTipEl.style.opacity = "";
        calTipEl.setAttribute("aria-hidden", "true");
      }

      function calHoverTipInnerHtml(key) {
        const shadeRank = buildShadeRankMap();
        const laneInfo = buildLaneMap();
        const tasks = tasksFor(key);
        if (!tasks.length) return "";
        const sorted = tasks.slice().sort(function (a, b) {
          const la = laneInfo.laneMap.has(a.id) ? laneInfo.laneMap.get(a.id) : 0;
          const lb = laneInfo.laneMap.has(b.id) ? laneInfo.laneMap.get(b.id) : 0;
          if (la !== lb) return la - lb;
          const c = (a.phaseStart || "").localeCompare(b.phaseStart || "");
          if (c !== 0) return c;
          return String(a.id || "").localeCompare(String(b.id || ""));
        });
        const parts = [];
        for (let i = 0; i < sorted.length; i++) {
          const task = sorted[i];
          const rank = shadeRank.has(task.id) ? shadeRank.get(task.id) : 0;
          const shade = "shade-" + String(rank % 5);
          const name = (task.project || "").trim() || "（未命名）";
          parts.push(
            '<div class="cal-hover-tip-row">' +
              '<span class="cal-hover-tip-dot ' +
              shade +
              '" aria-hidden="true"></span>' +
              '<span class="cal-hover-tip-name">' +
              escapeHtml(name) +
              "</span></div>"
          );
        }
        return parts.join("");
      }

      function positionCalHoverTipAt(clientX, clientY) {
        if (!calTipEl || !calTipEl.innerHTML) return;
        calTipEl.style.left = "-9999px";
        calTipEl.style.top = "0px";
        calTipEl.style.visibility = "visible";
        calTipEl.style.opacity = "0";
        const tw = calTipEl.offsetWidth || 160;
        const th = calTipEl.offsetHeight || 1;
        const pad = 8;
        const ox = 14;
        const oy = 14;
        let left = clientX + ox;
        let top = clientY + oy;
        if (left + tw > window.innerWidth - pad) {
          left = clientX - tw - ox;
        }
        if (top + th > window.innerHeight - pad) {
          top = clientY - th - oy;
        }
        if (left < pad) left = pad;
        if (top < pad) top = pad;
        calTipEl.style.left = Math.round(left) + "px";
        calTipEl.style.top = Math.round(top) + "px";
        calTipEl.style.visibility = "";
        calTipEl.style.opacity = "";
        calTipEl.classList.add("is-visible");
      }

      function queueCalHoverTipPosition(clientX, clientY) {
        if (!calTipEl || !calTipEl.classList.contains("is-visible")) return;
        if (calTipPosRaf) cancelAnimationFrame(calTipPosRaf);
        calTipPosRaf = requestAnimationFrame(function () {
          calTipPosRaf = null;
          positionCalHoverTipAt(clientX, clientY);
        });
      }

      function scheduleShowCalHoverTip() {
        clearTimeout(calTipHideT);
        calTipHideT = null;
        clearTimeout(calTipShowT);
        calTipShowT = setTimeout(function () {
          calTipShowT = null;
          if (!calTipEl || openKey) return;
          const key = calTipPendingKey;
          if (!key || !tasksFor(key).length) return;
          const inner = calHoverTipInnerHtml(key);
          if (!inner) return;
          calTipActiveKey = key;
          calTipEl.innerHTML = inner;
          calTipEl.setAttribute("aria-hidden", "false");
          positionCalHoverTipAt(calTipCursorX, calTipCursorY);
        }, 70);
      }

      function scheduleHideCalHoverTip() {
        clearTimeout(calTipShowT);
        calTipShowT = null;
        calTipHideT = setTimeout(function () {
          hideCalHoverTip();
        }, 100);
      }

      function initCalHoverTip() {
        calTipEl = document.getElementById("calHoverTip");
        if (!calTipEl || calTipEl.dataset.bound === "1") return;
        calTipEl.dataset.bound = "1";
        calGrid.addEventListener(
          "mouseover",
          function (ev) {
            if (openKey) return;
            const btn = ev.target.closest(".day-cell");
            if (!btn || !calGrid.contains(btn)) return;
            const key = btn.dataset.date;
            if (!key) return;
            if (!tasksFor(key).length) return;
            calTipPendingKey = key;
            calTipCursorX = ev.clientX;
            calTipCursorY = ev.clientY;
            scheduleShowCalHoverTip();
          },
          true
        );
        calGrid.addEventListener(
          "mousemove",
          function (ev) {
            if (openKey) return;
            calTipCursorX = ev.clientX;
            calTipCursorY = ev.clientY;
            const btn = ev.target.closest(".day-cell");
            if (!btn || !calGrid.contains(btn)) return;
            const key = btn.dataset.date;
            if (!key || !tasksFor(key).length) {
              if (calTipEl && calTipEl.classList.contains("is-visible")) {
                scheduleHideCalHoverTip();
              }
              return;
            }
            calTipPendingKey = key;
            clearTimeout(calTipHideT);
            calTipHideT = null;
            if (calTipEl && calTipEl.classList.contains("is-visible")) {
              if (key !== calTipActiveKey) {
                const inner = calHoverTipInnerHtml(key);
                if (!inner) {
                  hideCalHoverTip();
                  return;
                }
                calTipActiveKey = key;
                calTipEl.innerHTML = inner;
              }
              queueCalHoverTipPosition(ev.clientX, ev.clientY);
            }
          },
          true
        );
        calGrid.addEventListener(
          "mouseout",
          function (ev) {
            const rel = ev.relatedTarget;
            if (rel && calGrid.contains(rel)) return;
            scheduleHideCalHoverTip();
          },
          true
        );
        calGrid.addEventListener("mouseleave", function () {
          scheduleHideCalHoverTip();
        });
        window.addEventListener(
          "scroll",
          function () {
            hideCalHoverTip();
          },
          true
        );
        window.addEventListener("resize", hideCalHoverTip);
      }

      function removeTaskById(id) {
        store.items = store.items.filter(function (t) {
          return t.id !== id;
        });
        saveStore();
      }

      function resetForm() {
        fProject.value = "";
        fPhaseStart.value = openKey || "";
        fPhaseEnd.value = openKey || "";
        fClient.value = "";
        fStyle.value = "";
        fColors.value = "";
        fCopy.value = "";
      }

      function updateFormModeUI() {
        if (editingId) {
          cancelEditBtn.hidden = false;
          formActions.classList.add("form-actions--edit");
          submitCommissionBtn.textContent = "保存修改";
        } else {
          cancelEditBtn.hidden = true;
          formActions.classList.remove("form-actions--edit");
          submitCommissionBtn.textContent = "添加约稿";
        }
      }

      function clearEdit() {
        editingId = null;
        updateFormModeUI();
      }

      function beginEditTask(task) {
        editingId = task.id;
        fProject.value = task.project || "";
        fPhaseStart.value = task.phaseStart || openKey || "";
        fPhaseEnd.value = task.phaseEnd || task.phaseStart || openKey || "";
        fClient.value = task.client || "";
        fStyle.value = task.style || "";
        fColors.value = task.colors || "";
        fCopy.value = task.copy || "";
        updateFormModeUI();
        formEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
        fProject.focus();
      }

      function openSheet(key) {
        hideCalHoverTip();
        openKey = key;
        const [y, mo, da] = key.split("-").map(Number);
        const dt = new Date(y, mo - 1, da);
        sheetTitle.textContent =
          y + "年" + mo + "月" + da + "日 周" + WEEK[dt.getDay()];
        clearEdit();
        resetForm();
        renderDayList();
        if (sheetBodyScroll) sheetBodyScroll.scrollTop = 0;
        sheet.classList.add("open");
        overlay.classList.add("open");
        sheet.setAttribute("aria-hidden", "false");
        overlay.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        renderCalendar();
        fProject.focus();
      }

      function closeSheet() {
        openKey = null;
        clearEdit();
        sheet.classList.remove("open");
        overlay.classList.remove("open");
        sheet.setAttribute("aria-hidden", "true");
        overlay.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        listEl.innerHTML = "";
        renderCalendar();
      }

      function updateDayCount() {
        if (!openKey) return;
        const tasks = tasksFor(openKey);
        const n = tasks.filter((t) => !t.done).length;
        countEl.textContent = String(n);
        emptyEl.classList.toggle("hidden", tasks.length > 0);
      }

      function formatDeadlineDisplay(d) {
        if (!d || !String(d).trim()) return "";
        const p = String(d).slice(0, 10);
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(p);
        if (!m) return d;
        return m[1] + "年" + Number(m[2]) + "月" + Number(m[3]) + "日";
      }

      function metaLine(label, value) {
        if (!value || !String(value).trim()) return "";
        return (
          "<span><b>" +
          label +
          "</b> " +
          String(value)
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\n/g, " ") +
          "</span>"
        );
      }

      function buildLi(task, withEnterAnim) {
        const li = document.createElement("li");
        li.className =
          "task-item" + (task.done ? " completed" : "") + (withEnterAnim ? " entering" : "");
        li.dataset.id = task.id;

        const wrap = document.createElement("div");
        wrap.className = "checkbox-wrap";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = task.done;
        cb.setAttribute("aria-label", "标记完成");
        cb.id = "cb-" + task.id;

        const ui = document.createElement("span");
        ui.className = "checkbox-ui";
        ui.innerHTML =
          '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';

        const body = document.createElement("div");
        body.className = "task-body";

        const title = document.createElement("div");
        title.className = "task-title";
        title.textContent = task.project || "（未命名稿件）";

        const meta = document.createElement("div");
        meta.className = "task-meta";
        const { start: spanStart, end: spanEnd } = spanBounds(task);
        const bits = [];
        const phaseDisp =
          spanStart === spanEnd
            ? formatDeadlineDisplay(spanStart)
            : formatDeadlineDisplay(spanStart) + " — " + formatDeadlineDisplay(spanEnd);
        bits.push(metaLine("工期", phaseDisp));
        bits.push(
          metaLine("稿主", task.client),
          metaLine("风格", task.style),
          metaLine("配色", task.colors),
          metaLine("文案", task.copy)
        );
        meta.innerHTML = bits.filter(Boolean).length
          ? bits.filter(Boolean).join("")
          : "<span>暂无更多信息</span>";

        cb.addEventListener("change", () => {
          task.done = cb.checked;
          li.classList.toggle("completed", task.done);
          saveStore();
          updateDayCount();
          renderCalendar();
        });

        const del = document.createElement("button");
        del.type = "button";
        del.className = "delete";
        del.setAttribute("aria-label", "删除");
        del.innerHTML =
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/></svg>';

        const edit = document.createElement("button");
        edit.type = "button";
        edit.className = "edit-item";
        edit.setAttribute("aria-label", "编辑约稿");
        edit.innerHTML =
          '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>';
        edit.addEventListener("click", function (ev) {
          ev.stopPropagation();
          beginEditTask(task);
        });

        del.addEventListener("click", () => {
          if (li.classList.contains("removing")) return;
          li.classList.add("removing");
          const id = task.id;
          if (editingId === id) {
            clearEdit();
            resetForm();
          }
          let finished = false;
          const finish = () => {
            if (finished) return;
            finished = true;
            removeTaskById(id);
            updateDayCount();
            renderCalendar();
            if (li.parentNode) li.remove();
          };
          li.addEventListener("animationend", (e) => {
            if (e.animationName === "taskLeave") finish();
          });
          setTimeout(finish, 420);
        });

        const actions = document.createElement("div");
        actions.className = "task-actions";
        actions.appendChild(edit);
        actions.appendChild(del);

        wrap.appendChild(cb);
        wrap.appendChild(ui);
        body.appendChild(title);
        body.appendChild(meta);
        li.appendChild(wrap);
        li.appendChild(body);
        li.appendChild(actions);
        return li;
      }

      function renderDayList() {
        if (!openKey) return;
        listEl.innerHTML = "";
        tasksFor(openKey).forEach((t) => listEl.appendChild(buildLi(t, false)));
        updateDayCount();
      }

      function isToday(y, m, d) {
        const t = new Date();
        return t.getFullYear() === y && t.getMonth() === m && t.getDate() === d;
      }

      function renderCalendar() {
        hideCalHoverTip();
        const y = view.getFullYear();
        const m = view.getMonth();
        monthLabel.textContent = y + "年 " + (m + 1) + "月";

        const first = new Date(y, m, 1);
        const startPad = first.getDay();
        const lastDate = new Date(y, m + 1, 0).getDate();
        const prevLast = new Date(y, m, 0).getDate();

        const cells = [];
        let day = 1;
        let next = 1;

        for (let i = 0; i < 42; i++) {
          let cy = y;
          let cm = m;
          let cd;
          let inMonth = true;

          if (i < startPad) {
            inMonth = false;
            cm = m - 1;
            if (cm < 0) {
              cm = 11;
              cy = y - 1;
            }
            cd = prevLast - (startPad - 1 - i);
          } else if (day <= lastDate) {
            cd = day++;
          } else {
            inMonth = false;
            cd = next++;
            cm = m + 1;
            if (cm > 11) {
              cm = 0;
              cy = y + 1;
            }
          }

          const key = dateKey(cy, cm, cd);
          cells.push({ key: key, cy: cy, cm: cm, cd: cd, inMonth: inMonth });
        }

        const keys = cells.map(function (c) {
          return c.key;
        });

        const shadeRank = buildShadeRankMap();
        const laneInfo = buildLaneMap();

        calGrid.innerHTML = "";
        cells.forEach(function (cell, i) {
          const key = cell.key;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "day-cell" + (cell.inMonth ? "" : " other");
          if (isToday(cell.cy, cell.cm, cell.cd)) btn.classList.add("today");
          if (openKey === key) btn.classList.add("selected");
          btn.setAttribute("aria-label", key + "，点击查看约稿");
          btn.dataset.date = key;
          btn.innerHTML =
            '<span class="day-num">' +
            cell.cd +
            "</span>" +
            rangeBarsHtml(key, i, keys, shadeRank, laneInfo);
          btn.addEventListener("click", function () {
            openSheet(key);
          });
          calGrid.appendChild(btn);
        });
      }

      function switchMonth(delta) {
        calGrid.classList.add("switching");
        view = new Date(view.getFullYear(), view.getMonth() + delta, 1);
        renderCalendar();
        setTimeout(() => calGrid.classList.remove("switching"), 280);
      }

      prevBtn.addEventListener("click", () => switchMonth(-1));
      nextBtn.addEventListener("click", () => switchMonth(1));
      sheetClose.addEventListener("click", closeSheet);
      overlay.addEventListener("click", closeSheet);

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && openKey) closeSheet();
      });

      cancelEditBtn.addEventListener("click", function () {
        clearEdit();
        resetForm();
      });

      formEl.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!openKey) return;
        const project = fProject.value.trim();
        if (!project) {
          fProject.focus();
          return;
        }
        let ps = normDateStr(fPhaseStart.value);
        let pe = normDateStr(fPhaseEnd.value);
        if (!ps && !pe) {
          ps = openKey;
          pe = openKey;
        } else if (ps && !pe) {
          pe = ps;
        } else if (!ps && pe) {
          ps = pe;
        }
        if (pe < ps) {
          const tmp = ps;
          ps = pe;
          pe = tmp;
        }
        if (editingId) {
          const existing = store.items.find(function (t) {
            return t.id === editingId;
          });
          if (existing) {
            existing.project = project;
            existing.phaseStart = ps;
            existing.phaseEnd = pe;
            existing.client = fClient.value.trim();
            existing.style = fStyle.value.trim();
            existing.colors = fColors.value.trim();
            existing.copy = fCopy.value.trim();
          }
          saveStore();
          clearEdit();
          resetForm();
          renderDayList();
          renderCalendar();
          fProject.focus();
          return;
        }
        const task = {
          id: newId(),
          done: false,
          phaseStart: ps,
          phaseEnd: pe,
          project: project,
          client: fClient.value.trim(),
          style: fStyle.value.trim(),
          colors: fColors.value.trim(),
          copy: fCopy.value.trim(),
        };
        store.items.push(task);
        saveStore();
        resetForm();
        listEl.appendChild(buildLi(task, true));
        updateDayCount();
        renderCalendar();
        fProject.focus();
      });

      updateFormModeUI();
      initCalHoverTip();
      renderCalendar();
    })();
  </script>
</body>
</html>
